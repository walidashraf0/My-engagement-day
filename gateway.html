<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Enter the story of W and H." />
    <title>W &amp; H — Our Forever</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/gateway.css" />
</head>

<body>
    <main class="gateway">
        <div class="gateway-stars" aria-hidden="true"></div>
        <div class="gateway-glow" aria-hidden="true"></div>
        <div class="petal-field" aria-hidden="true"></div>
        <div class="gateway-content">
            <p class="gateway-kicker">A private chapter</p>
            <div class="initials" aria-label="W and H">
                <span>W</span><i>♥</i><span>H</span>
            </div>
            <p class="gateway-line">Two hearts. One story. Forever begins here.</p>
            <button id="enterButton" type="button">
          Enter Our Story <span aria-hidden="true">→</span>
        </button>
            <div class="gateway-progress" aria-label="Opening our story">
                <span></span>
            </div>
        </div>
    </main>
    <script src="js/gateway.js"></script>
</body>

</html>
